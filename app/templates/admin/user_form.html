{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">المستخدمون</span><h1>تعديل المستخدم</h1></div></div><div class="card-soft"><form method="post" class="row g-3"><div class="col-md-3"><label class="form-label">اسم المستخدم</label><input name="username" class="form-control" value="{{user.username}}" required></div><div class="col-md-4"><label class="form-label">الاسم الكامل</label><input name="full_name" class="form-control" value="{{user.full_name}}" required></div><div class="col-md-2"><label class="form-label">الهاتف</label><input name="phone" class="form-control" value="{{user.phone or ''}}"></div><div class="col-md-3"><label class="form-label">الدور</label><select name="role" class="form-select">{% for r in roles %}<option value="{{r}}" {% if r==user.role %}selected{% endif %}>{{r}}</option>{% endfor %}</select></div><div class="col-md-5"><label class="form-label">الموظف</label><select name="employee_id" class="form-select"><option value="">—</option>{% for e in employees %}<option value="{{e.id}}" {% if e.id==user.employee_id %}selected{% endif %}>{{e.full_name}}</option>{% endfor %}</select></div><div class="col-md-5"><label class="form-label">كلمة مرور جديدة</label><input name="password" type="password" class="form-control"></div><div class="col-12"><button class="btn btn-primary">حفظ</button> <a class="btn btn-light" href="{{url_for('admin.users')}}">رجوع</a></div></form></div>{% endblock %}
