{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">العملاء</span><h1>تعديل العميل والوكالات المرتبطة</h1></div></div><div class="card-soft"><form method="post" class="row g-3"><div class="col-md-2"><label class="form-label">الكود</label><input name="code" class="form-control" value="{{client.code}}" required></div><div class="col-md-5"><label class="form-label">الاسم</label><input name="name" class="form-control" value="{{client.name}}" required></div><div class="col-md-5"><label class="form-label">الهاتف</label><input name="phone" class="form-control" value="{{client.phone or ''}}"></div><div class="col-md-6"><label class="form-label">العنوان</label><input name="address" class="form-control" value="{{client.address or ''}}"></div><div class="col-12"><label class="form-label">الوكلاء المرتبطون</label><select name="agent_ids" class="form-select" multiple size="6">{% for a in agents %}<option value="{{a.id}}" {% if a.id in selected %}selected{% endif %}>{{a.name}}</option>{% endfor %}</select></div><div class="col-12"><textarea name="notes" class="form-control">{{client.notes or ''}}</textarea></div><div><button class="btn btn-primary">حفظ</button> <a href="{{url_for('master_data.clients')}}" class="btn btn-light">رجوع</a></div></form></div>{% endblock %}
