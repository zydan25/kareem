{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">المركبات</span><h1>تعديل المركبة</h1></div></div><div class="card-soft"><form method="post" class="row g-3"><div class="col-md-2"><label class="form-label">اللوحة</label><input name="plate_number" class="form-control" value="{{vehicle.plate_number}}" required></div><div class="col-md-2"><label class="form-label">الفاصل</label><input name="plate_separator" class="form-control" value="{{vehicle.plate_separator or ''}}"></div><div class="col-md-2"><label class="form-label">الحروف</label><input name="plate_letters" class="form-control" value="{{vehicle.plate_letters or ''}}"></div><div class="col-md-3"><label class="form-label">النوع</label><select name="vehicle_type_id" class="form-select">{% for t in vehicle_types %}<option value="{{t.id}}" {% if t.id==vehicle.vehicle_type_id %}selected{% endif %}>{{t.name}}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">العميل</label><select name="client_id" class="form-select"><option value="">غير مربوط</option>{% for c in clients %}<option value="{{c.id}}" {% if c.id==vehicle.client_id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">الوكلاء المحتملون</label><select name="agent_ids" class="form-select" multiple size="6">{% for a in agents %}<option value="{{a.id}}" {% if a.id in selected %}selected{% endif %}>{{a.name}}</option>{% endfor %}</select></div><div class="col-12"><textarea name="notes" class="form-control">{{vehicle.notes or ''}}</textarea></div><div><button class="btn btn-primary">حفظ</button> <a class="btn btn-light" href="{{url_for('master_data.vehicles')}}">رجوع</a></div></form></div>{% endblock %}
