{% extends 'base.html' %}
{% block title %}تعديل المركبة - {{app_name}}{% endblock %}
{% block content %}
<div class="page-head"><div><span class="eyebrow">المركبات</span><h1>تعديل المركبة</h1><p>اللوحة اختيارية للمركبة بدون جمارك.</p></div><a class="btn btn-light" href="{{url_for('master_data.vehicle_detail',vehicle_id=vehicle.id)}}">ملف المركبة</a></div>
<div class="card-soft"><form method="post" class="row g-3" id="edit-vehicle-form">
<div class="col-12 col-md-3"><label class="form-label">حالة المركبة</label><select name="registration_status" id="vehicle-registration-status" class="form-select"><option value="registered" {% if vehicle.registration_status!='without_customs' %}selected{% endif %}>بلوحة جمركية</option><option value="without_customs" {% if vehicle.registration_status=='without_customs' %}selected{% endif %}>بدون جمارك / بدون رقم</option></select></div>
<div class="col-12 col-md-3"><label class="form-label">رقم اللوحة</label><input name="plate_number" id="vehicle-plate-number" class="form-control" value="{{vehicle.plate_number or ''}}" placeholder="اتركه فارغًا لبدون جمارك"></div>
<div class="col-6 col-md-2"><label class="form-label">الفاصل</label><input name="plate_separator" class="form-control" value="{{vehicle.plate_separator or ''}}"></div>
<div class="col-6 col-md-2"><label class="form-label">الحروف</label><input name="plate_letters" class="form-control" value="{{vehicle.plate_letters or ''}}"></div>
<div class="col-12 col-md-2"><label class="form-label">نوع المركبة</label><select name="vehicle_type_id" class="form-select">{% for t in vehicle_types %}<option value="{{t.id}}" {% if t.id==vehicle.vehicle_type_id %}selected{% endif %}>{{t.name}}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">العميل</label><select name="client_id" class="form-select"><option value="">غير مربوط</option>{% for c in clients %}<option value="{{c.id}}" {% if c.id==vehicle.client_id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">الوكلاء المحتملون</label><select name="agent_ids" class="form-select" multiple size="5">{% for a in agents %}<option value="{{a.id}}" {% if a.id in selected %}selected{% endif %}>{{a.name}}</option>{% endfor %}</select></div>
<div class="col-12"><textarea name="notes" class="form-control" placeholder="وصف أو ملاحظات">{{vehicle.notes or ''}}</textarea></div>
<div class="col-12"><button class="btn btn-primary">حفظ</button> <a class="btn btn-light" href="{{url_for('master_data.vehicles')}}">رجوع</a></div>
</form></div>
{% endblock %}
{% block scripts %}
<script>
const rs=document.getElementById('vehicle-registration-status'),plate=document.getElementById('vehicle-plate-number');
function syncVehiclePlate(){if(rs&&plate)plate.required=rs.value==='registered';}
rs?.addEventListener('change',syncVehiclePlate);syncVehiclePlate();
</script>
{% endblock %}
