{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">شجرة الحسابات</span><h1>إضافة حساب فرعي</h1><p>نوع الحساب يرث من الأب، والحساب الرئيسي غير قابل للقيد.</p></div></div><div class="card-soft"><form method="post" class="row g-3"><div class="col-md-5"><label class="form-label">الأب</label><select name="parent_id" class="form-select" required>{% for p in parents %}<option value="{{p.id}}">{{p.code}} — {{p.name}}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">الكود</label><input name="code" class="form-control" required></div><div class="col-md-4"><label class="form-label">الاسم</label><input name="name" class="form-control" required></div><div class="col-12"><label class="form-check"><input class="form-check-input" type="checkbox" name="is_group" value="1"> <span>إنشاء مجموعة فرعية (غير قابلة للقيد)</span></label></div><div><button class="btn btn-primary">حفظ</button> <a class="btn btn-light" href="{{url_for('accounting.accounts')}}">رجوع</a></div></form></div>{% endblock %}
