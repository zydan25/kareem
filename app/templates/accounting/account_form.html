{% extends 'base.html' %}
{% block title %}إضافة حساب - {{app_name}}{% endblock %}
{% block content %}
<div class="page-head"><div><span class="eyebrow">المحاسبة</span><h1>إضافة حساب</h1><p>اختر الحساب الأب، واكتب الاسم فقط. رمز الحساب ينشأ تلقائيًا حسب شجرة الحسابات.</p></div><a class="btn btn-light" href="{{url_for('accounting.accounts')}}">رجوع</a></div>
<div class="card-soft">
<form method="post" class="row g-3">
<div class="col-12 col-lg-6"><label class="form-label">الحساب الأب</label><select name="parent_id" id="parent-account" class="form-select form-select-lg" required>{% for p in parents %}<option value="{{p.id}}" data-code="{{p.code}}" {% if selected_parent and p.id==selected_parent.id %}selected{% endif %}>{{'📁 ' if p.is_group else '↳ '}}{{p.code}} — {{p.name}}</option>{% endfor %}</select></div>
<div class="col-12 col-lg-3"><label class="form-label">رمز الحساب</label><input id="auto-code" class="form-control form-control-lg" value="{{auto_code}}" readonly><small class="text-muted">توليد تلقائي</small></div>
<div class="col-12 col-lg-3"><label class="form-label">نوع الحساب</label><input id="parent-type" class="form-control" value="{{selected_parent.account_type if selected_parent else ''}}" readonly></div>
<div class="col-12"><label class="form-label">اسم الحساب</label><input name="name" class="form-control form-control-lg" required autofocus placeholder="مثال: مصروف كهرباء"></div>
<div class="col-12"><label class="form-check"><input class="form-check-input" type="checkbox" name="is_group" value="1"><span class="form-check-label">هذا الحساب مجموعة فرعية أخرى (لا تُستخدم في القيود)</span></label></div>
<div class="col-12"><button class="btn btn-primary btn-lg">إنشاء الحساب</button></div>
</form>
</div>
{% endblock %}
{% block scripts %}<script>
const p=document.getElementById('parent-account'), code=document.getElementById('auto-code'), typ=document.getElementById('parent-type');
p?.addEventListener('change',()=>{const o=p.selectedOptions[0];typ.value=o?.dataset?.type||'';location.href='?parent_id='+encodeURIComponent(p.value)});
</script>{% endblock %}
