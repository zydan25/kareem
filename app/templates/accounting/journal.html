{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">المحاسبة</span><h1>القيود اليومية</h1><p>القيد المرحل لا يُعدل؛ التصحيح بقيد عكسي.</p></div></div><div class="card-soft table-wrap"><table class="table align-middle"><thead><tr><th>رقم</th><th>التاريخ</th><th>الوصف</th><th>المصدر</th><th>الحالة</th><th></th></tr></thead><tbody>{% for e in entries %}<tr><td><code>{{e.number}}</code></td><td>{{e.entry_date}}</td><td class="fw-bold">{{e.description}}</td><td>{{e.source_type}}</td><td>{{e.status}}</td><td><a class="btn btn-sm btn-light" href="{{url_for('accounting.journal_detail',entry_id=e.id)}}">عرض</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
