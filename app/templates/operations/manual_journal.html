{% extends 'base.html' %}{% block content %}<div class="page-head"><div><span class="eyebrow">المحاسبة</span><h1>قيد يومية يدوي</h1><p>اختر الحسابات الفرعية فقط؛ يجب أن يتساوى المدين والدائن.</p></div></div><form method="post"><div class="card-soft"><div class="row g-3"><div class="col-md-8"><label class="form-label">البيان</label><input name="description" class="form-control" required></div><div class="col-md-4"><label class="form-label">التاريخ</label><input type="date" name="entry_date" class="form-control" value="{{today.isoformat() if today is defined else ''}}"></div></div></div><div class="card-soft mt-3 table-wrap"><table class="table align-middle"><thead><tr><th>#</th><th>الحساب</th><th>مدين</th><th>دائن</th><th>البيان</th></tr></thead><tbody>{% for n in rows %}<tr><td>{{n}}</td><td><select name="account_id_{{n}}" class="form-select"><option value="">اختر</option>{% for a in accounts %}<option value="{{a.id}}">{{a.code}} — {{a.name}}</option>{% endfor %}</select></td><td><input name="debit_{{n}}" class="form-control" inputmode="decimal"></td><td><input name="credit_{{n}}" class="form-control" inputmode="decimal"></td><td><input name="line_description_{{n}}" class="form-control"></td></tr>{% endfor %}</tbody></table><div class="d-flex justify-content-between align-items-center"><strong>التوازن شرط للترحيل</strong><button class="btn btn-primary btn-lg">ترحيل القيد</button></div></div></form>{% endblock %}
