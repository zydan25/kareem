{% extends 'base.html' %}
{% block title %}الصلاحية غير متاحة - {{app_name}}{% endblock %}
{% block content %}
<div class="card-soft" style="max-width:560px;margin:28px auto;text-align:center;padding:28px 20px">
  <div style="width:66px;height:66px;display:grid;place-items:center;margin:0 auto 14px;border-radius:20px;background:#fff0ef;color:#bc3c35;font-size:30px"><i class="bi bi-shield-lock-fill"></i></div>
  <h1 style="font-size:21px;font-weight:900;margin:0 0 10px">ليس لديك صلاحية لفتح هذه الصفحة</h1>
  <p class="text-muted" style="font-size:13px;line-height:1.8;margin-bottom:14px">حساب الموظف الحالي لا يملك إذن عرض هذه الشاشة. على مدير النظام تفعيل الصلاحية المناسبة لهذا الحساب من إدارة الصلاحيات.</p>
  <div class="badge-soft mb-3" dir="ltr">{{attempted_path}}</div>
  <div class="d-flex justify-content-center gap-2 flex-wrap">
    <button class="btn btn-primary" type="button" onclick="history.back()"><i class="bi bi-arrow-right"></i> العودة</button>
    <form method="post" action="{{url_for('auth.logout')}}"><button class="btn btn-light" type="submit"><i class="bi bi-box-arrow-left"></i> الخروج لتغيير الحساب</button></form>
  </div>
</div>
{% endblock %}
